name: DevSecOps Pipeline (Build Breaker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate:
    name: Security Gate (SAST & SCA)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias y herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: 🔍 SAST - Análisis Estático de Código con Bandit
        run: |
          echo "Ejecutando Bandit en app.py..."
          bandit -r app.py

      - name: 🛡️ SCA - Auditoría de Dependencias con pip-audit
        run: |
          echo "Ejecutando pip-audit sobre requirements.txt..."
          pip-audit -r requirements.txt
